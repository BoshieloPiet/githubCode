
name: Build HTML Docker Image

# Trigger the pipeline when code is pushed
on:
  push:
    branches:
      - main

  # Also allow manual execution
  workflow_dispatch:

jobs:
  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Login to GitLab Container Registry
      - name: Login to GitLab Registry
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_USERNAME }}
          password: ${{ secrets.GITLAB_TOKEN }}

      # Step 3: Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t registry.gitlab.com/YOUR_GITLAB_GROUP/YOUR_PROJECT/simple-html-app:latest \
            .

      # Step 4: Verify Docker image
      - name: Verify Docker Image
        run: |
          docker images

      # Step 5: Push Docker image to GitLab
      - name: Push Docker Image
        run: |
          docker push registry.gitlab.com/YOUR_GITLAB_GROUP/YOUR_PROJECT/simple-html-app:latest
